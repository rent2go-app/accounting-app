<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="assets/linda-sm.png">
<title>Renters &amp; ID Verification — Rent 2 Go</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="assets/style.css">
<style>
:root{--bg:#eef1f5;--surface:#fff;--surface-2:#f2f5f9;--text:#131820;--muted:#5c6a7a;--line:#c9d2de;--brand:#0f8a4d;--in:#0a7d44;--out:#c22a2a;--gold:#eab54e;--shadow:0 1px 3px rgba(16,24,40,.08)}
@media(prefers-color-scheme:dark){:root{--bg:#0c0f14;--surface:#151b23;--surface-2:#1b2330;--text:#e7ebf1;--muted:#93a0b0;--line:#2b333f;--brand:#12a35c;--in:#38d07f;--out:#f36f6f}}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
.topbar{display:flex;align-items:center;gap:12px;padding:11px 20px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.brandlogo{height:28px}.sub{color:var(--muted);font-weight:700}.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:9px;padding:7px 12px;font-weight:700;cursor:pointer;font-family:inherit;font-size:13px}
.btn.pri{background:var(--brand);color:#fff;border-color:var(--brand)}.btn.danger{color:var(--out);border-color:var(--out)}
.btn.small{padding:4px 9px;font-size:12px}
.wrap{max-width:1000px;margin:0 auto;padding:16px 20px 60px}
.banner{background:color-mix(in srgb,var(--gold) 18%,var(--surface));border:1px solid var(--gold);color:#7a5c12;border-radius:12px;padding:10px 14px;font-weight:700;font-size:13px;margin-bottom:14px}
.lavatar{width:30px;height:30px;border-radius:50%;vertical-align:middle}
.says{display:flex;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:16px;align-items:flex-start}
.says img{width:56px;height:56px;border-radius:50%;flex:0 0 auto}
.says .bubble{flex:1}
.says .bubble h3{margin:0 0 6px;font-size:14px}
.says .bubble h3 span{color:var(--muted);font-weight:600;font-size:12px}
.says ul{margin:0;padding-left:18px}
.says li{font-size:13px;margin:4px 0;line-height:1.4}
.says li.warn{color:#8a6d1e}.says li.red{color:var(--out);font-weight:700}.says li.ok{color:var(--in)}
#lindaWidget{position:fixed;left:18px;bottom:22px;z-index:40}
#lindaFace{width:64px;height:64px;border-radius:50%;box-shadow:0 6px 20px rgba(0,0,0,.28);cursor:pointer;border:3px solid var(--surface);transition:transform .15s}
#lindaFace:hover{transform:scale(1.06)}
#lindaTag{position:absolute;left:50%;transform:translateX(-50%);bottom:-8px;background:var(--brand);color:#fff;font-size:9px;font-weight:800;padding:2px 7px;border-radius:20px;white-space:nowrap}
#lindaBubble{position:absolute;left:78px;bottom:0;width:290px;max-width:70vw;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 34px rgba(0,0,0,.24);padding:13px 15px;display:none}
#lindaWidget.open #lindaBubble{display:block}
#lindaBubble h3{margin:0 0 7px;font-size:13px}
#lindaBubble ul{margin:0;padding-left:17px}#lindaBubble li{font-size:12.5px;margin:5px 0;line-height:1.4}
#lindaBubble li.warn{color:#8a6d1e}#lindaBubble li.red{color:var(--out);font-weight:700}#lindaBubble li.ok{color:var(--in)}
#lindaBubble .x{position:absolute;top:8px;right:10px;cursor:pointer;color:var(--muted);font-weight:800}
@media(max-width:700px){#lindaFace{width:52px;height:52px}#lindaBubble{width:220px}}
.hero{display:flex;gap:26px;align-items:center;background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 12%,var(--surface)),var(--surface));border:1px solid var(--line);border-radius:20px;padding:24px 26px;margin-bottom:18px;box-shadow:var(--shadow)}
.heroimg{width:min(40vw,340px);aspect-ratio:1;object-fit:cover;border-radius:18px;box-shadow:0 14px 38px rgba(0,0,0,.24);flex:0 0 auto}
.herotext{flex:1;min-width:0}
.heroeyebrow{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--brand)}
#greeting{font-size:clamp(24px,3.4vw,34px);margin:6px 0 4px;line-height:1.1;text-wrap:balance}
.herosub{color:var(--muted);margin:0 0 14px;font-size:15px}
.dryrun{margin-top:14px;font-size:12px;color:#8a6d1e;background:color-mix(in srgb,var(--gold) 14%,var(--surface));border:1px solid var(--gold);border-radius:10px;padding:8px 12px}
#heroBubble h3{margin:0 0 6px;font-size:14px}
#heroBubble ul{margin:0;padding-left:18px}#heroBubble li{font-size:13px;margin:5px 0;line-height:1.45}
#heroBubble li.warn{color:#8a6d1e}#heroBubble li.red{color:var(--out);font-weight:700}#heroBubble li.ok{color:var(--in)}
@media(max-width:720px){.hero{flex-direction:column;text-align:center}.heroimg{width:min(74vw,300px)}.herotext{text-align:center}#heroBubble{text-align:left}}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column}
.ctop{display:flex;align-items:center;gap:11px}
.cicon{flex:none}.cicon svg{width:42px;height:42px;display:block}
.card .l{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-top:9px}
.card .v{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1;margin-left:auto}
.card .v small{font-size:15px;font-weight:800;color:var(--muted)}
.card .v.red{color:var(--out)}.card .v.pos{color:var(--in)}.card .v.pink{color:#d6336c}
.card .cd{font-size:11px;color:var(--muted);margin-top:4px;font-weight:600;line-height:1.3;min-height:14px}
.card .cd b{color:var(--text)}
.reauditbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.btn.big{font-size:14px;font-weight:800;padding:11px 18px;border-radius:11px}
#heroBubble li.pink{color:#d6336c;font-weight:700}
h2{font-size:15px;margin:18px 0 8px}
.ic{width:16px;height:16px;vertical-align:-3px;margin-right:5px;flex:0 0 auto}
.icfee{width:24px;height:24px;vertical-align:-7px;margin-right:7px;flex:0 0 auto}
.acct{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.accttl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:15px;font-weight:800;margin:0;padding:14px 16px;cursor:pointer;list-style:none;user-select:none}
.accttl::-webkit-details-marker{display:none}
.accttl::before{content:'▸';color:var(--muted);font-size:13px;transition:transform .18s;display:inline-block}
details.acct[open] .accttl::before{transform:rotate(90deg)}
.accttl:hover{background:var(--surface-2)}
.accttl .btn.aud{margin-left:10px;flex:none}
.acctfresh{font-size:11.5px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:7px 10px;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.acctfresh b{color:var(--text)}
.acctfresh.stale{background:color-mix(in srgb,var(--out) 12%,var(--surface));color:var(--out);border:1px solid var(--out)}
.acctfresh.stale b{color:var(--out)}
.ledgerbar{font-size:11.5px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:7px 10px;margin:8px 0 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ledgerbar b{color:var(--text)}
.ledgerbar [data-refreshledger]{margin-left:auto}
.ledgerbar.stale{background:color-mix(in srgb,var(--out) 12%,var(--surface));color:var(--out)}
.ledgerbar.stale b{color:var(--out)}
.acctbody{padding:0 16px 14px}
.asum{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-left:auto}
.apill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--surface-2);color:var(--muted);font-variant-numeric:tabular-nums}
.apill.warn{background:color-mix(in srgb,#eab54e 20%,var(--surface));color:#8a6516}
.apill.red{background:color-mix(in srgb,var(--out) 16%,var(--surface));color:var(--out)}
.apill.done{background:color-mix(in srgb,var(--brand) 15%,var(--surface));color:var(--brand)}
.accmeta{font-size:11px;color:var(--muted);font-weight:600}
.foldbar{display:flex;gap:8px;align-items:center;margin:6px 0 2px}
.feetbl{width:100%;border-collapse:collapse;font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.feetbl td{padding:8px 10px;border-bottom:1px solid var(--line)}
.feetbl tr.hd td{font-size:10px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:800;background:var(--surface-2)}
.feetbl td.n{text-align:right;font-variant-numeric:tabular-nums}
.feetbl tr.tot td{font-weight:800;background:var(--surface-2)}
.feetbl tr.memorow td{background:var(--surface-2);color:var(--muted);font-size:11.5px;line-height:1.4;border-bottom:2px solid var(--line)}
.paygrp{margin:10px 0}
.paygrphd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:800;font-size:13px;margin-bottom:5px}
.paygrpt{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.paygrpt b{color:var(--out)}
.ostag{font-size:10px;font-weight:800;padding:2px 7px;border-radius:10px;margin-left:5px}
.ostag.disc{background:color-mix(in srgb,var(--out) 16%,var(--surface));color:var(--out)}
.ostag.rec{background:#8a1c1c;color:#fff}
.ostag.warn{background:color-mix(in srgb,#eab54e 22%,var(--surface));color:#8a6516}
.ostag.paid{background:color-mix(in srgb,var(--brand) 16%,var(--surface));color:var(--brand)}
.feegrp{margin:12px 0;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.feegrphd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:800;font-size:13px;margin-bottom:6px}
.feegrpt{font-size:11.5px;font-weight:700;color:var(--out);font-variant-numeric:tabular-nums}
.feegrphd button{margin-left:auto}
.reusehint{margin-top:9px;padding:8px 11px;background:color-mix(in srgb,#7a5cff 9%,var(--surface));border:1px solid color-mix(in srgb,#7a5cff 28%,var(--line));border-radius:9px;font-size:12px;color:var(--muted)}
.reusesnip{font-style:italic;margin-top:3px;color:var(--muted);font-size:11.5px;line-height:1.35}
.linkbtn{background:none;border:none;color:#7a5cff;font-weight:800;cursor:pointer;padding:0;font-size:12px;text-decoration:underline}
.feewrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 14px;margin-bottom:16px;box-shadow:var(--shadow)}
.feewrap summary{cursor:pointer;font-weight:800;font-size:14px;padding:9px 0;list-style:none}
.feewrap summary::-webkit-details-marker{display:none}
.feewrap summary::before{content:'▸ ';color:var(--muted)}
.feewrap[open] summary::before{content:'▾ '}
.feewrap[open] summary{border-bottom:1px solid var(--line);margin-bottom:10px}
.skwrap{margin-top:18px;background:var(--surface-2);border:1px dashed var(--line);border-radius:12px;padding:6px 14px}
.skwrap summary{cursor:pointer;font-weight:800;font-size:13px;color:var(--muted);padding:6px 0}
.skbody{padding:6px 0}
.skrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
.skrow .dmail{color:var(--muted);font-size:12px}
.skrow .amt{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums}
.skrow .skre{font-size:11px;color:var(--muted);font-weight:700}
.learnwrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.learnwrap summary{cursor:pointer;font-weight:800;font-size:13px;padding:6px 0}
.learnlist{margin:4px 0 8px;padding-left:18px}.learnlist li{font-size:12.5px;margin:6px 0;line-height:1.45}
.draft{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.draft.disc{border-color:var(--out);border-left:5px solid var(--out)}
.draft.recovery{border-color:#8a1c1c;border-left:5px solid #8a1c1c}
.dhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dname{font-weight:800}.dmail{color:var(--muted);font-size:12px}
.kind{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;padding:3px 8px;border-radius:7px}
.kind.reminder{background:color-mix(in srgb,var(--brand) 12%,var(--surface));color:var(--brand)}
.kind.disconnect{background:color-mix(in srgb,var(--out) 14%,var(--surface));color:var(--out)}
.kind.recovery{background:#8a1c1c;color:#fff}
.amt{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums}
.dsubj{font-weight:700;margin:8px 0 4px;font-size:13px}
.dbody{white-space:pre-wrap;font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:9px;padding:10px;max-height:0;overflow:hidden;transition:max-height .2s}
.draft.open .dbody{max-height:400px;overflow:auto}
.dact{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.ein{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;margin:4px 0 8px;background:var(--surface);color:var(--text);font-family:inherit;font-size:13px}
.eta{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);font-family:inherit;font-size:12.5px;line-height:1.5;resize:vertical}
.status{font-size:11px;font-weight:800;padding:3px 8px;border-radius:7px}
.status.approved{background:color-mix(in srgb,var(--in) 14%,var(--surface));color:var(--in)}
.status.sent{background:var(--brand);color:#fff}
.status.skipped{background:var(--surface-2);color:var(--muted)}
.status.reviewed{background:color-mix(in srgb,#7a5cff 16%,var(--surface));color:#7a5cff}
.status.plan{background:color-mix(in srgb,#0d9488 16%,var(--surface));color:#0d9488}
.status.plan.behind{background:color-mix(in srgb,#eab54e 24%,var(--surface));color:#8a6516}
.status.disc-signal{background:var(--out);color:#fff}
.status.disc-restored{background:color-mix(in srgb,var(--in) 18%,var(--surface));color:var(--in)}
.status.disc-grace{background:color-mix(in srgb,#7a5cff 16%,var(--surface));color:#7a5cff}
.discwrap{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:14px 0}
.discwrap>summary{cursor:pointer;font-weight:800;font-size:15px;list-style:none}
.discwrap>summary::-webkit-details-marker{display:none}
.disccard{border:1px solid var(--line);border-left:4px solid var(--out);border-radius:10px;padding:11px 13px;margin:10px 0;background:var(--surface-2)}
.disccard.active{border-left-color:var(--out);background:color-mix(in srgb,var(--out) 6%,var(--surface))}
.disccard.restored{border-left-color:var(--in);background:color-mix(in srgb,var(--in) 7%,var(--surface))}
.dischd{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:8px}
.discname{font-weight:800}
.discacct{font-size:11px;color:var(--muted)}
.discamt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.dbadge{margin-left:auto;font-size:11px;font-weight:800;padding:3px 9px;border-radius:7px}
.dbadge.red{background:var(--out);color:#fff}
.dbadge.warn{background:color-mix(in srgb,#eab54e 22%,var(--surface));color:#8a6516}
.dbadge.on{background:color-mix(in srgb,var(--in) 18%,var(--surface));color:var(--in)}
.dbadge.grace{background:color-mix(in srgb,#7a5cff 18%,var(--surface));color:#7a5cff}
.disccard.grace{border-left-color:#7a5cff;background:color-mix(in srgb,#7a5cff 6%,var(--surface))}
.dgrace .dtime{flex:0 0 auto;min-width:0;width:118px}
.dts.exp{color:var(--out);font-weight:700}
.gpsrow{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:13px}
.gpssel{max-width:340px;padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--text);font-size:12.5px}
.gpsresult{flex-basis:100%}
.gpstrack{margin-top:6px;padding:8px 10px;background:var(--surface);border-radius:8px;font-size:12.5px;display:flex;flex-direction:column;gap:5px}
.ignbadge{display:inline-block;font-weight:800;font-size:11px;padding:2px 8px;border-radius:6px}
.ignbadge.on{background:color-mix(in srgb,var(--out) 18%,var(--surface));color:var(--out)}
.ignbadge.off{background:color-mix(in srgb,var(--in) 18%,var(--surface));color:var(--in)}
.gpsmot{color:var(--muted)}
.gpsev{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.gpsok{font-weight:700;color:var(--in)}
.gpsmap{width:100%;max-width:520px;height:240px;border:1px solid var(--line);border-radius:9px;margin-top:4px}
.gpsdry{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);margin:0 0 10px}
.gpsdry:has(input:not(:checked)){color:var(--out);font-weight:700}
.vmacct{border:1px solid var(--line);border-radius:9px;margin:8px 0;padding:2px 10px}
.vmacct>summary{cursor:pointer;font-weight:700;font-size:13px;padding:7px 0}
.vmrow{padding:7px 0;border-top:1px solid var(--line)}
.vmrow:first-of-type{border-top:none}
.vmname{font-weight:700;font-size:13px;display:block;margin-bottom:2px}
.vmrow .gpsrow{margin-top:4px;padding-top:4px;border-top:none}
.discwrap.plans .disccard.active{border-left-color:#eab54e;background:color-mix(in srgb,#eab54e 8%,var(--surface))}
.planterms{font-weight:700;color:var(--text)}
.btn.small.danger{background:var(--out);color:#fff;border-color:var(--out)}
.planflag{background:#7a5cff;color:#fff;font-weight:800;font-size:12.5px;padding:8px 12px;border-radius:8px;margin:6px 0 9px;letter-spacing:.3px}
.planflag.big{font-size:13.5px;margin:8px 0}
.discwrap.plans .disccard.behind{border-left-color:#7a5cff;background:color-mix(in srgb,#7a5cff 8%,var(--surface))}
.dchecks{display:flex;flex-direction:column;gap:7px}
.dchk{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.dchk input{width:16px;height:16px;accent-color:var(--out)}
.dact{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.dlbl{color:var(--muted);min-width:82px}
.dinput{flex:1;min-width:200px;padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--text);font-size:13px}
.dts{font-size:11px;color:var(--muted)}
.dnotice{font-size:12px;font-weight:700;padding:5px 9px;border-radius:7px;margin-bottom:8px;display:inline-block}
.dnotice.sent{background:color-mix(in srgb,var(--in) 15%,var(--surface));color:var(--in)}
.dnotice.unsent{background:color-mix(in srgb,var(--out) 13%,var(--surface));color:var(--out)}
.dtimeline{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:9px;padding:7px 10px;background:var(--surface);border-radius:8px}
.dtimeline b{color:var(--text);font-variant-numeric:tabular-nums}
.tl-dur{margin-left:auto;font-weight:700}
.tl-dur.live{color:var(--out)}
.status.raised{background:color-mix(in srgb,#eab54e 22%,var(--surface));color:#8a6516}
.ltoast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:#131820;color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.28);opacity:0;transition:all .25s;z-index:9999;max-width:90vw;text-align:center}
.ltoast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.btn.on{background:color-mix(in srgb,#7a5cff 16%,var(--surface));color:#7a5cff;border-color:#7a5cff}
.btn.ok{background:color-mix(in srgb,var(--brand) 14%,var(--surface));color:var(--brand);border-color:var(--brand);font-weight:800}
.draft.done{opacity:.62}.draft.done:hover{opacity:1}
.dayprog{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:2px 0 14px;font-size:13px;font-weight:700}
.dayprog .pill{padding:5px 11px;border-radius:20px;background:var(--surface-2);color:var(--muted);font-variant-numeric:tabular-nums}
.dayprog .pill b{color:var(--text)}
.dayprog .pill.alldone{background:var(--brand);color:#fff}.dayprog .pill.alldone b{color:#fff}
.dayprog .pill.brief{background:color-mix(in srgb,#7a5cff 16%,var(--surface));color:#7a5cff}
.dayprog .pill.red{background:color-mix(in srgb,var(--out) 16%,var(--surface));color:var(--out)}
.briefbar{background:color-mix(in srgb,#7a5cff 8%,var(--surface));border:1px solid color-mix(in srgb,#7a5cff 35%,var(--line));border-left:4px solid #7a5cff;border-radius:12px;padding:12px 16px;margin-bottom:16px;box-shadow:var(--shadow)}
.briefhd{font-size:12px;font-weight:900;letter-spacing:.05em;color:#7a5cff;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.briefts{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:0}
.briefday{margin-top:8px;font-size:13px;color:var(--text);font-variant-numeric:tabular-nums;line-height:1.5}
.briefday b.pos{color:var(--in)}.briefday b.red{color:var(--out)}
.stalewarn{margin-top:8px;background:color-mix(in srgb,var(--out) 12%,var(--surface));border:1px solid var(--out);color:var(--out);border-radius:9px;padding:8px 12px;font-size:12.5px;font-weight:700}
.briefpills{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.briefpills .pill{font-size:12.5px;font-weight:700;padding:5px 12px;border-radius:20px;background:var(--surface-2);color:var(--muted);font-variant-numeric:tabular-nums}
.briefpills .pill b{color:var(--text)}
.briefpills .pill.alldone{background:var(--brand);color:#fff}.briefpills .pill.alldone b{color:#fff}
.briefpills .pill.done{background:color-mix(in srgb,var(--brand) 15%,var(--surface));color:var(--brand)}.briefpills .pill.done b{color:var(--brand)}
.briefpills .pill.warn{background:color-mix(in srgb,#eab54e 22%,var(--surface));color:#8a6516}
.briefpills .pill.red{background:color-mix(in srgb,var(--out) 16%,var(--surface));color:var(--out)}.briefpills .pill.red b{color:var(--out)}
.loginwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.logincard{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:28px;width:340px;max-width:100%}
.logincard h1{margin:0 0 4px;font-size:20px}.logincard input{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;margin-top:8px;background:var(--surface);color:var(--text)}
.logincard button{width:100%;margin-top:14px;padding:10px;background:var(--brand);color:#fff;border:none;border-radius:9px;font-weight:800;cursor:pointer}
.err{color:var(--out);font-size:12.5px;margin-top:10px;min-height:16px}
.hint{color:var(--muted);font-size:12.5px}

.wrap{max-width:1000px;margin:0 auto;padding:16px 20px 60px}
.addrt{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0 18px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.addrt input{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);font-size:13px}
.rtcard{border:1px solid var(--line);border-left:4px solid var(--line-strong);border-radius:12px;padding:12px 14px;margin:10px 0;background:var(--surface)}
.rtcard.verified{border-left-color:var(--in)}.rtcard.pending{border-left-color:var(--gold)}.rtcard.failed{border-left-color:var(--out)}
.rthead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rtname{font-weight:800;font-size:15px}.rtsub{font-size:12px;color:var(--muted)}
.rtbadge{font-size:11px;font-weight:800;padding:3px 9px;border-radius:7px;margin-left:auto}
.rtbadge.verified{background:color-mix(in srgb,var(--in) 18%,var(--surface));color:var(--in)}
.rtbadge.pending{background:color-mix(in srgb,var(--gold) 26%,var(--surface));color:#8a6516}
.rtbadge.failed{background:color-mix(in srgb,var(--out) 16%,var(--surface));color:var(--out)}
.rtbadge.new{background:var(--surface-2);color:var(--muted)}
.rtbadge.dec-approved{background:var(--in);color:#fff;margin-left:6px}
.rtbadge.dec-rejected{background:var(--out);color:#fff;margin-left:6px}
.rtverif{margin-top:8px;padding:8px 10px;background:var(--surface-2);border-radius:8px;font-size:12.5px;display:flex;flex-direction:column;gap:3px}
.rtverif b{color:var(--text)}
.rtact{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:9px}
.rtnote{flex:1;min-width:180px;padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--text);font-size:12.5px}
.rtlink{font-size:11.5px;color:var(--brand);word-break:break-all}
</style>
</head><body>
<div id="loginwrap" class="loginwrap"><form class="logincard" id="li_form"><div style="text-align:center"><img src="assets/linda-sm.png" alt="" style="width:64px;height:64px;border-radius:50%"></div><p style="text-align:center">Renters &amp; ID Verification — admin sign in.</p><label>Email</label><input id="li_email" type="email" autocomplete="username" required><label>Password</label><input id="li_pass" type="password" autocomplete="current-password" required><button id="li_btn" type="submit">Sign in</button><div class="err" id="li_err"></div></form></div>
<div id="noadmin" class="loginwrap" style="display:none"><div class="logincard"><h1>Admins only</h1><p id="noadmin_who"></p><button class="btn" onclick="location.href='index.html'">← Back to the ledger</button> <button class="btn" id="na_out">Sign out</button></div></div>
<div id="appwrap" style="display:none">
<div class="topbar"><img class="brandlogo" src="assets/logo.png" alt="Rent 2 Go"><span class="sub">· Renters &amp; ID Verification</span><div class="spacer"></div><button class="btn" onclick="location.href='linda.html'"><img src="assets/linda-sm.png" style="width:18px;height:18px;border-radius:50%;vertical-align:middle;margin-right:5px" alt="">Linda</button><button class="btn" onclick="location.href='owners.html'">👥 Owners</button><button class="btn" onclick="location.href='gps.html'">🚗 GPS</button><button class="btn" onclick="location.href='index.html'">← Ledger</button><button class="btn" id="signout">Sign out</button></div>
<main class="wrap">
<h2 style="margin:6px 0 2px">🪪 Renters &amp; ID Verification</h2>
<p class="hint" style="margin:0 0 8px">Add a renter, generate a Stripe Identity link (driver's licence + selfie), send it, then review the verified result and approve. ID images are stored by Stripe, not here.</p>
<div class="addrt"><input id="rt_name" placeholder="Full name"><input id="rt_email" type="email" placeholder="Email (for the link)"><input id="rt_phone" placeholder="Phone (optional)"><button class="btn pri" id="rt_add">+ Add renter</button></div>
<div id="rtlist"></div>
</main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>window.R2G_CONFIG={SUPABASE_URL:'https://fsapfxhyjbgxjydahdlx.supabase.co',SUPABASE_ANON_KEY:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZzYXBmeGh5amJneGp5ZGFoZGx4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5MTI5ODgsImV4cCI6MjEwMDQ4ODk4OH0.CHS63agKi6FAoUwmFpy_SkqCpH9UTRAzyQAUoNbEcUM'};</script>
<script>
const sb=window.supabase.createClient(window.R2G_CONFIG.SUPABASE_URL, window.R2G_CONFIG.SUPABASE_ANON_KEY);
const ADMINS=['gorentaride@gmail.com','thurstonrdavis@gmail.com','thandobnkala@gmail.com'];
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function toast(msg){var t=document.createElement('div');t.className='ltoast';t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.classList.add('show');},10);setTimeout(function(){t.classList.remove('show');setTimeout(function(){t.remove();},300);},2800);}
function shortET(iso){try{return new Date(iso).toLocaleString('en-US',{timeZone:'America/New_York',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});}catch(e){return '';}}
let RENTERS=[];
function statusClass(s){return s==='verified'?'verified':(s==='canceled'||s==='requires_action')?'failed':(s==='new'?'new':'pending');}
// Stripe gives us licence photographs but not the date of birth. An admin reads
// it off the image (🪪 View licence) and records it here. Writing verified_dob
// fires the database trigger, which recomputes the deposit, the age check and
// the dob_match flag against whatever the renter typed at sign-up.
async function confirmDob(i){
  var c=RENTERS[i];
  var typed=c.dob?('\n\nThe renter typed: '+c.dob):'\n\n(They did not give a date of birth at sign-up.)';
  var v=prompt('Date of birth exactly as printed on the licence (YYYY-MM-DD):'+typed,c.verified_dob||c.dob||'');
  if(v===null)return;
  v=v.trim();
  if(v&&!/^\d{4}-\d{2}-\d{2}$/.test(v)){alert('Please use YYYY-MM-DD, e.g. 1994-03-27');return;}
  try{
    var r=await sb.from('renters').update({verified_dob:v||null}).eq('id',c.id).select().single();
    if(r.error)throw r.error;
    var d=r.data;
    toast('Saved — deposit $'+(d.deposit_total||'?')+(d.dob_match===false?' · ⚠ does NOT match what they typed':(d.dob_match===true?' · ✓ matches':'')));
    if(d.eligibility==='under_21')alert('⚠ This renter is '+d.age_years+' — under 21 and not eligible to rent.');
    await load(); render();
  }catch(e){alert('Could not save: '+(e.message||e));}
}
function statusLabel(s){return {new:'no link yet',requires_input:'link sent · awaiting renter',processing:'processing…',verified:'✅ verified',canceled:'canceled',requires_action:'⚠ needs attention'}[s]||s;}
async function inv(b){var r=await sb.functions.invoke('id-verify',{body:b});if(r.error)throw r.error;if(r.data&&r.data.error)throw new Error(typeof r.data.error==='string'?r.data.error:JSON.stringify(r.data.error));return r.data;}
async function load(){var r=await sb.from('renters').select('*').order('created_at',{ascending:false});RENTERS=r.data||[];render();}
function render(){
  var el=document.getElementById('rtlist');
  if(!RENTERS.length){el.innerHTML='<p class="hint">No renters yet — add one above.</p>';return;}
  el.innerHTML=RENTERS.map(function(c,i){
    var sc=statusClass(c.status);
    var dec=c.decision==='approved'?'<span class="rtbadge dec-approved">APPROVED</span>':c.decision==='rejected'?'<span class="rtbadge dec-rejected">REJECTED</span>':'';
    var verif=(c.status==='verified')?'<div class="rtverif"><span>Verified name: <b>'+esc(c.verified_name||'—')+'</b></span><span>DOB: <b>'+esc(c.verified_dob||'—')+'</b> · Document: <b>'+esc(c.verified_doc_type||'—')+' '+esc(c.verified_doc_number||'')+'</b>'+(c.verified_expiry?' · expires <b>'+esc(c.verified_expiry)+'</b>':'')+'</span>'+(c.verified_address?'<span>Address: '+esc(c.verified_address)+'</span>':'')+'</div>':'';
    var linkbtns='';
    if(!c.session_id){linkbtns='<button class="btn small pri" data-gen="'+i+'">🪪 Generate ID link</button>';}
    else{linkbtns='<button class="btn small" data-copy="'+i+'">🔗 Copy link</button> <a class="btn small" href="'+esc(c.verify_url||'#')+'" target="_blank" rel="noopener">Open</a> <button class="btn small" data-refresh="'+i+'">↻ Refresh status</button>';}
    // Stripe returns no date of birth — only photographs of the licence, and the
    // API cannot download those (403). They ARE viewable in the Stripe dashboard,
    // so: open the licence there, read the DOB, key it in. That sets verified_dob,
    // which recomputes the deposit and the dob_match check automatically.
    if(c.session_id){
      linkbtns+=' <a class="btn small" href="https://dashboard.stripe.com/identity/verification-sessions/'+esc(c.session_id)+'" target="_blank" rel="noopener" title="See the licence images Stripe captured">🪪 View licence</a>'
        +' <button class="btn small" data-dob="'+i+'" title="Read the date of birth off the licence and record it">📅 '+(c.verified_dob?'DOB '+esc(c.verified_dob):'Confirm DOB')+'</button>';
    }
    if(c.deposit_total){
      var bd=c.deposit_breakdown||{};
      linkbtns+=' <span class="btn small" style="cursor:default" title="'+esc('base $'+(bd.base||150)+(bd.out_of_town?' + out of town $'+bd.out_of_town:'')+(bd.young_renter?' + young renter $'+bd.young_renter:''))+'">💵 deposit $'+esc(c.deposit_total)+'</span>';
    }
    if(c.needs_review&&c.review_reason){
      linkbtns+=' <span class="btn small" style="cursor:default;color:#c22a2a" title="'+esc(c.review_reason)+'">⚠ review</span>';
    }
    return '<div class="rtcard '+sc+'"><div class="rthead"><span class="rtname">'+esc(c.name||'(no name)')+'</span><span class="rtsub">'+esc(c.email||'no email')+(c.phone?' · '+esc(c.phone):'')+'</span><span class="rtbadge '+sc+'">'+statusLabel(c.status)+'</span>'+dec+'</div>'+verif
      +'<div class="rtact">'+linkbtns+' <button class="btn small ok" data-approve="'+i+'">✅ Approve</button> <button class="btn small danger" data-reject="'+i+'">✕ Reject</button> <input class="rtnote" data-noteinput="'+i+'" placeholder="notes" value="'+esc(c.notes||'')+'"><button class="btn small" data-savenote="'+i+'">Save</button> <button class="btn small" data-del="'+i+'" title="Remove">✕</button></div></div>';
  }).join('');
  bind();
}
function bind(){
  document.querySelectorAll('[data-gen]').forEach(b=>b.onclick=()=>genLink(+b.dataset.gen));
  document.querySelectorAll('[data-dob]').forEach(b=>b.onclick=()=>confirmDob(+b.dataset.dob));
  document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{navigator.clipboard.writeText(RENTERS[+b.dataset.copy].verify_url||'');toast('Link copied ✓');});
  document.querySelectorAll('[data-refresh]').forEach(b=>b.onclick=()=>refresh(+b.dataset.refresh));
  document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>decide(+b.dataset.approve,'approved'));
  document.querySelectorAll('[data-reject]').forEach(b=>b.onclick=()=>decide(+b.dataset.reject,'rejected'));
  document.querySelectorAll('[data-savenote]').forEach(b=>b.onclick=()=>saveNote(+b.dataset.savenote));
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>delRenter(+b.dataset.del));
}
async function addRenter(){var n=document.getElementById('rt_name').value.trim();var e=document.getElementById('rt_email').value.trim();var p=document.getElementById('rt_phone').value.trim();if(!n){alert('Enter a name.');return;}var r=await sb.from('renters').insert([{name:n,email:e,phone:p,status:'new'}]);if(r.error){alert(r.error.message);return;}document.getElementById('rt_name').value='';document.getElementById('rt_email').value='';document.getElementById('rt_phone').value='';toast('Renter added ✓');await load();}
async function genLink(i){var c=RENTERS[i];if(!c.email){alert('Add an email for this renter first (the link is emailed / sent to them).');return;}try{var d=await inv({action:'create',renter_id:c.id,renter:{name:c.name,email:c.email,phone:c.phone}});toast('ID link generated ✓');await load();try{await navigator.clipboard.writeText(d.url);toast('Link copied — send it to the renter');}catch(e){}}catch(e){alert('Could not generate link: '+(e.message||e));}}
async function refresh(i){var c=RENTERS[i];try{var d=await inv({action:'status',session_id:c.session_id});toast('Status: '+(d.status||'?'));await load();}catch(e){alert('Refresh failed: '+(e.message||e));}}
async function decide(i,dec){var c=RENTERS[i];if(dec==='rejected'&&!confirm('Reject '+(c.name||'this renter')+'?'))return;var r=await sb.from('renters').update({decision:dec,decision_at:new Date().toISOString()}).eq('id',c.id);if(r.error){alert(r.error.message);return;}toast(dec==='approved'?'Approved ✓':'Rejected');await load();}
async function saveNote(i){var c=RENTERS[i];var v=document.querySelector('[data-noteinput="'+i+'"]').value;var r=await sb.from('renters').update({notes:v}).eq('id',c.id);if(r.error){alert(r.error.message);return;}toast('Note saved ✓');}
async function delRenter(i){var c=RENTERS[i];if(!confirm('Remove '+(c.name||'this renter')+'?'))return;await sb.from('renters').delete().eq('id',c.id);await load();}
async function boot(){var s=await sb.auth.getSession();var u=s.data.session&&s.data.session.user;if(!u)return;if(ADMINS.indexOf((u.email||'').toLowerCase())<0){document.getElementById('loginwrap').style.display='none';document.getElementById('noadmin').style.display='flex';document.getElementById('noadmin_who').textContent='Signed in as '+u.email+' — this page is limited to admins.';return;}document.getElementById('loginwrap').style.display='none';document.getElementById('appwrap').style.display='block';document.getElementById('rt_add').onclick=addRenter;await load();}
document.getElementById('li_form').addEventListener('submit',async function(ev){ev.preventDefault();var b=document.getElementById('li_btn');var er=document.getElementById('li_err');er.textContent='';b.disabled=true;b.textContent='Signing in…';var r=await sb.auth.signInWithPassword({email:document.getElementById('li_email').value.trim(),password:document.getElementById('li_pass').value});b.disabled=false;b.textContent='Sign in';if(r.error){er.textContent=r.error.message;return;}location.reload();});
document.getElementById('signout').onclick=async()=>{await sb.auth.signOut();location.reload();};
document.getElementById('na_out').onclick=async()=>{await sb.auth.signOut();location.reload();};
boot();
</script>
</body></html>
