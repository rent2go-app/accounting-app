<script>
const sb=window.supabase.createClient(window.R2G_CONFIG.SUPABASE_URL,window.R2G_CONFIG.SUPABASE_ANON_KEY);
const ADMINS=['gorentaride@gmail.com','thurstonrdavis@gmail.com'];
const BUCKET='team-evidence';
const FORMS=['Vehicle pickup inspection','Vehicle drop-off inspection','Recovery inspection report','Cleaning checklist','Fuel / car-wash receipt','General task report'];
const COST_KINDS=['Lyft ride','Uber ride','Car wash','Fuel','Parts','Other'];
const METHODS=['CashApp','Apple Pay','Zelle','Card','Cash','Bank transfer'];

let MEMBERS=[],TASKS=[],PAYOUTS=[],REFUNDS=[],CATALOG=[],CARS=[];
let VIEW='board',CUR=null,DAY=todayET(),ME='';
let TIMER=null,ASSIGN={stops:['',''],perMile:0,editId:null,memberId:null},PROOF=null,RECEIPT=null;
const SIGNED={};

/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
const r2=n=>Math.round((+n||0)*100)/100;
const money=v=>'$'+(+v||0).toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2});
function todayET(){return new Date().toLocaleDateString('en-CA',{timeZone:'America/New_York'});}
function shiftDay(iso,n){const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
function niceDay(iso){const d=new Date(iso+'T12:00:00');return d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});}
function shortDay(iso){const d=new Date(iso+'T12:00:00');return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});}
function fmtEl(sec){const m=Math.floor(sec/60),s=sec%60;return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;}
function elapsed(t){if(!t.started_at)return 0;const end=t.finished_at?new Date(t.finished_at).getTime():Date.now();return Math.max(0,Math.floor((end-new Date(t.started_at).getTime())/1000));}
function toast(m){const h=document.getElementById('toastHost');h.innerHTML='<div class="toast">'+esc(m)+'</div>';setTimeout(()=>{h.innerHTML='';},2600);}
function openOv(id){document.getElementById(id).classList.add('open');}
function closeOv(id){document.getElementById(id).classList.remove('open');}
document.querySelectorAll('.ov').forEach(o=>o.onclick=e=>{if(e.target===o)o.classList.remove('open');});
const member=id=>MEMBERS.find(m=>m.id===id);
const memberTasks=id=>TASKS.filter(t=>t.member_id===id);
function dayTasks(id,d){return memberTasks(id).filter(t=>t.day===d).sort((a,b)=>(a.status==='done'?1:0)-(b.status==='done'?1:0));}
function overdue(id){const td=todayET();return memberTasks(id).filter(t=>t.day<td&&t.status!=='done').sort((a,b)=>a.day<b.day?-1:1);}
const earned=(id,d)=>r2(dayTasks(id,d).filter(t=>t.status==='done').reduce((s,t)=>s+(+t.payout||0),0));
const potential=(id,d)=>r2(dayTasks(id,d).reduce((s,t)=>s+(+t.payout||0),0));
const logged=(id,d)=>r2(dayTasks(id,d).reduce((s,t)=>s+(t.costs||[]).reduce((a,c)=>a+(+c.amount||0),0),0));
const payoutFor=(id,d)=>PAYOUTS.find(p=>p.member_id===id&&p.day===d);
function owedFor(id,d){return r2(dayTasks(id,d).filter(t=>t.status==='done'&&!t.paid).reduce((s,t)=>s+(+t.payout||0),0));}

/* resize before upload — never store full-resolution photos */
function resizeImage(file,max){return new Promise(res=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;if(w>max||h>max){if(w>h){h=Math.round(h*max/w);w=max;}else{w=Math.round(w*max/h);h=max;}}const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);cv.toBlob(b=>res(b),'image/jpeg',0.72);};img.onerror=()=>res(null);img.src=fr.result;};fr.onerror=()=>res(null);fr.readAsDataURL(file);});}
async function upload(path,blob){const r=await sb.storage.from(BUCKET).upload(path,blob,{contentType:'image/jpeg',upsert:true});if(r.error)throw r.error;return path;}
async function signed(path){if(!path)return'';if(SIGNED[path])return SIGNED[path];const r=await sb.storage.from(BUCKET).createSignedUrl(path,3600);if(r.error||!r.data)return'';SIGNED[path]=r.data.signedUrl;return r.data.signedUrl;}
async function paintSigned(){const els=document.querySelectorAll('[data-sp]');for(const el of els){const u=await signed(el.dataset.sp);if(u)el.src=u;}}

/* ---------- data ---------- */
async function load(){
  const [m,t,p,rf,c,f]=await Promise.all([
    sb.from('team_members').select('*').order('name'),
    sb.from('team_tasks').select('*').order('day',{ascending:false}).limit(4000),
    sb.from('team_payouts').select('*').order('day',{ascending:false}),
    sb.from('team_refunds').select('*').order('created_at',{ascending:false}),
    sb.from('team_task_catalog').select('*').eq('active',true).order('sort_order'),
    sb.from('owners_program').select('owners').eq('id',1).single()
  ]);
  [m,t,p,rf,c].forEach(r=>{if(r.error)console.error(r.error);});
  MEMBERS=m.data||[];TASKS=t.data||[];PAYOUTS=p.data||[];REFUNDS=rf.data||[];CATALOG=c.data||[];
  CARS=[];((f.data&&f.data.owners)||[]).forEach(o=>(o.cars||[]).forEach(cr=>{
    if(cr&&cr.id)CARS.push({id:cr.id,name:(cr.name||cr.plate||'Car'),plate:cr.plate||'',owner:o.name||''});
  }));
}
async function reload(){await load();render();}

/* ---------- render ---------- */
function render(){
  const el=document.getElementById('main');
  if(VIEW==='board')el.innerHTML=boardHTML();
  else if(VIEW==='member')el.innerHTML=memberHTML();
  else el.innerHTML=ledgerHTML();
  wire();paintSigned();startTimer();
}

function boardHTML(){
  const staff=MEMBERS.filter(m=>m.active!==false&&(m.role==='RC'||m.role==='V'));
  let issued=0,done=0,paid=0,owed=0;
  const cards=staff.map(s=>{
    const ts=dayTasks(s.id,DAY);

  +'</div>'
  +(cards||'<div class="card"><div class="empty">No tasks issued for '+shortDay(DAY)+'.<br><br>Open a team member below to assign one.</div></div>')

  +'<div class="warnbar"><b>Coordinator logins are not enabled yet.</b> The <code>team_*</code> tables are scoped correctly, but <code>day_blocks</code>, <code>owners_program</code>, <code>linda_*</code> and <code>fleet</code> are still readable by any signed-in user — a coordinator login would be able to read the whole ledger. Tighten those first.</div>';

/* ---------- timer ---------- */
function startTimer(){
  if(TIMER)clearInterval(TIMER);
  TIMER=setInterval(()=>{
    let any=false;
    TASKS.filter(t=>t.status==='started').forEach(t=>{
      const el=document.getElementById('tm_'+t.id);
      if(el){el.textContent=fmtEl(elapsed(t));any=true;}
    });
    if(!any){clearInterval(TIMER);TIMER=null;}
  },1000);
}

/* ---------- task actions ---------- */
async function patchTask(id,patch){
  const r=await sb.from('team_tasks').update(patch).eq('id',id).select().single();
  if(r.error){console.error(r.error);toast('Save failed: '+r.error.message);return null;}
  const i=TASKS.findIndex(t=>t.id===id);if(i>=0)TASKS[i]=r.data;
  return r.data;
}
function notesPatch(id){const el=document.getElementById('nt_'+id);if(!el)return{};const t=TASKS.find(x=>x.id===id);return(t&&t.notes!==el.value)?{notes:el.value}:{};}

async function startTask(id){await patchTask(id,Object.assign(notesPatch(id),{status:'started',started_at:new Date().toISOString(),finished_at:null}));render();toast('Timer started');}
async function stopTask(id){
  const t=TASKS.find(x=>x.id===id);if(!t)return;
  const fin=t.finished_at||new Date().toISOString();
  await patchTask(id,Object.assign(notesPatch(id),{finished_at:fin,elapsed_sec:elapsed(Object.assign({},t,{finished_at:fin}))}));
  render();toast('Timer stopped');
}
async function completeTask(id){
  const t=TASKS.find(x=>x.id===id);if(!t)return;
  if(!(t.evidence||[]).length){toast('Add at least one photo of evidence first — required for payment');return;}
  const fin=t.finished_at||(t.started_at?new Date().toISOString():null);
  const patch=Object.assign(notesPatch(id),{status:'done'});
  if(fin){patch.finished_at=fin;patch.elapsed_sec=elapsed(Object.assign({},t,{finished_at:fin}));}
  await patchTask(id,patch);render();toast('Task complete');
}
async function addEvidence(id,input){
  const files=Array.from(input.files||[]);if(!files.length)return;
  const t=TASKS.find(x=>x.id===id);if(!t)return;
  const sel=document.getElementById('ef_'+id);const form=sel?sel.value:'Evidence';
  toast('Uploading '+files.length+' photo(s)…');
  const ev=(t.evidence||[]).slice();
  try{
    for(const f of files){
      const blob=await resizeImage(f,1400);if(!blob)continue;
      const path=t.member_id+'/'+t.id+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,7)+'.jpg';
      await upload(path,blob);
      ev.push({path,form,name:f.name});
    }
    await patchTask(id,Object.assign(notesPatch(id),{evidence:ev}));
    render();toast(files.length+' photo(s) added: '+form);
  }catch(e){console.error(e);toast('Upload failed: '+(e.message||e));}
  input.value='';
}
async function delEvidence(id,i){
  const t=TASKS.find(x=>x.id===id);if(!t)return;
  const ev=(t.evidence||[]).slice();const gone=ev.splice(i,1)[0];
  if(gone&&gone.path){try{await sb.storage.from(BUCKET).remove([gone.path]);}catch(e){}}
  await patchTask(id,{evidence:ev});render();
}
async function addCost(id){
  const t=TASKS.find(x=>x.id===id);if(!t)return;
  const kind=prompt('Cost type:\n'+COST_KINDS.map((k,i)=>(i+1)+'. '+k).join('\n')+'\n\nEnter a number, or type your own:','1');
  if(kind===null)return;
  const k=/^\d+$/.test(kind)?(COST_KINDS[+kind-1]||'Other'):kind;
  const amt=prompt('Amount ($) for '+k+':','');if(amt===null)return;
  const costs=(t.costs||[]).concat([{kind:k,amount:+amt||0,when:new Date().toISOString()}]);
  await patchTask(id,{costs});render();toast(k+' '+money(+amt||0)+' added');
}
async function carryTask(id,to){
  const t=TASKS.find(x=>x.id===id);if(!t)return;
  const dest=(to&&to.trim())||todayET();
  if(dest===t.day){toast('Task is already on that date');return;}
  const log=(t.date_log||[]).concat([{from:t.day,to:dest,by:ME||'Admin',when:new Date().toISOString()}]);
  await patchTask(id,{day:dest,date_log:log});render();toast('Task carried to '+shortDay(dest));
}
async function delTask(id){
  const t=TASKS.find(x=>x.id===id);if(!t)return;
  if(!confirm('Delete "'+(t.title||'this task')+'"? This cannot be undone.'))return;
  const r=await sb.from('team_tasks').delete().eq('id',id);
  if(r.error){toast('Delete failed');return;}
  TASKS=TASKS.filter(x=>x.id!==id);render();toast('Task deleted');
}

      +'<div><label class="f">Payout ($) <span id="a_pm" style="text-transform:none;font-weight:600"></span></label><input id="a_pay" type="number" step="0.01" min="0" value="'+(t&&+t.payout?t.payout:'')+'" placeholder="0.00"></div></div>'
    +'<div class="f2"><div><label class="f">Timing</label><select id="a_tmode">'
      +['flexible','fixed'].map(m=>'<option value="'+m+'"'+(t&&t.time_mode===m?' selected':'')+'>'+(m==='flexible'?'Flexible':'Fixed time')+'</option>').join('')+'</select></div>'
      +'<div><label class="f">Time (if fixed)</label><input id="a_time" value="'+esc(t?t.fixed_time:'')+'" placeholder="e.g. 2:00 PM"></div></div>'
    +'<label class="f">Must be complete by (optional)</label><input id="a_due" value="'+esc(t?t.due_by:'')+'" placeholder="e.g. 5 PM today">'
    +'<div class="mact"><button class="btn" id="a_cancel">Cancel</button><button class="btn pri" id="a_save">'+(t?'Save changes':'Assign task')+'</button></div>';
  openOv('ovAssign');
  const kindSel=document.getElementById('a_kind');
  function renderStops(){
    const w=document.getElementById('a_stops');if(!w)return;
    if(ASSIGN.stops.length<2)ASSIGN.stops=['',''];
    w.innerHTML=ASSIGN.stops.map((a,i)=>{
      const lbl=i===0?'Start':(i===ASSIGN.stops.length-1?'End':'Stop '+i);
      const rm=ASSIGN.stops.length>2&&i!==0&&i!==ASSIGN.stops.length-1;
      return '<div class="stop"><span class="sl">'+lbl+'</span><input value="'+esc(a)+'" data-stop="'+i+'" placeholder="'+lbl+' address">'
        +(rm?'<button class="btn sm" type="button" data-rmstop="'+i+'">×</button>':'')+'</div>';
    }).join('');
    w.querySelectorAll('[data-stop]').forEach(el=>el.oninput=()=>{ASSIGN.stops[+el.dataset.stop]=el.value;});
    w.querySelectorAll('[data-rmstop]').forEach(b=>b.onclick=()=>{ASSIGN.stops.splice(+b.dataset.rmstop,1);renderStops();});
  }
  function recalc(){
    const pm=ASSIGN.perMile,mi=+document.getElementById('a_miles').value||0;
    document.getElementById('a_pm').textContent=pm?('· '+money(pm)+'/mile × miles'):'';
    if(kindSel.value==='distance'&&pm)document.getElementById('a_pay').value=r2(pm*mi).toFixed(2);
  }
  function syncKind(){
    const d=kindSel.value==='distance';
    document.getElementById('a_route').style.display=d?'block':'none';
    if(d)renderStops();
    recalc();
  }
  kindSel.onchange=syncKind;
  document.getElementById('a_miles').oninput=recalc;
  document.getElementById('a_addstop').onclick=()=>{ASSIGN.stops.splice(ASSIGN.stops.length-1,0,'');renderStops();};
  document.getElementById('a_quick').onchange=e=>{
    const c=CATALOG[+e.target.value];if(!c)return;
    document.getElementById('a_title').value=c.name;
    document.getElementById('a_pay').value=(+c.per_mile||c.manual)?'':(+c.price||0);
    kindSel.value=c.kind;ASSIGN.perMile=+c.per_mile||0;syncKind();
  };
  document.getElementById('a_cancel').onclick=()=>closeOv('ovAssign');
  document.getElementById('a_save').onclick=saveAssign;
  syncKind();
}
async function saveAssign(){
  const title=document.getElementById('a_title').value.trim();
  if(!title){toast('Add a task title');return;}
  const kind=document.getElementById('a_kind').value;
  const stops=kind==='distance'?ASSIGN.stops.map(s=>s.trim()).filter(Boolean):[];
  const miles=kind==='distance'?(+document.getElementById('a_miles').value||0):0;
  const pm=ASSIGN.perMile||0;
  const payout=(pm&&miles)?r2(pm*miles):(+document.getElementById('a_pay').value||0);
  const carId=document.getElementById('a_car').value;
  const car=CARS.find(c=>c.id===carId);
  const row={title,detail:document.getElementById('a_detail').value.trim(),
    day:document.getElementById('a_day').value||todayET(),
    payout:payout,per_mile:pm,miles:miles,stops:stops,kind:kind,
    car_id:carId||null,car_name:car?car.name:null,
    time_mode:document.getElementById('a_tmode').value,
    fixed_time:document.getElementById('a_time').value.trim(),
    due_by:document.getElementById('a_due').value.trim()};
  const btn=document.getElementById('a_save');btn.disabled=true;btn.textContent='Saving…';
  let r;
  if(ASSIGN.editId)r=await sb.from('team_tasks').update(row).eq('id',ASSIGN.editId).select().single();
  else r=await sb.from('team_tasks').insert(Object.assign({member_id:ASSIGN.memberId},row)).select().single();
  btn.disabled=false;btn.textContent=ASSIGN.editId?'Save changes':'Assign task';
  if(r.error){console.error(r.error);toast('Failed: '+r.error.message);return;}
  if(ASSIGN.editId){const i=TASKS.findIndex(t=>t.id===ASSIGN.editId);if(i>=0)TASKS[i]=r.data;}
  else TASKS.unshift(r.data);
  closeOv('ovAssign');render();toast(ASSIGN.editId?'Task updated':'Task assigned');
}

/* ---------- payout ---------- */
function openPayout(memberId){
  const s=member(memberId);if(!s)return;
  const due=dayTasks(memberId,DAY).filter(t=>t.status==='done'&&!t.paid);
  const amount=r2(due.reduce((a,t)=>a+(+t.payout||0),0));
  PROOF=null;
  const md=document.getElementById('mdPayout');
  if(!due.length){
    const already=payoutFor(memberId,DAY);
    md.innerHTML='<h3>Process payout — '+esc(s.name)+'</h3><p class="s">For <b>'+niceDay(DAY)+'</b></p>'
      +'<div class="empty">'+(already?'This day is already paid out ('+money(already.amount)+' via '+esc(already.method)+').':'No completed tasks ready for payout on this day yet. Complete tasks (with evidence) first, or switch days.')+'</div>'
      +'<div class="mact"><button class="btn pri" data-close="ovPayout">Close</button></div>';
    openOv('ovPayout');bindClose();return;
  }
  md.innerHTML='<h3>Process payout — '+esc(s.name)+'</h3>'
    +'<p class="s">End-of-day payout for <b>'+niceDay(DAY)+'</b>. A payout screenshot is required as proof.</p>'
    +'<div class="psum">'+due.map(t=>'<div class="r"><span>'+esc(t.title)+'</span><span>'+money(t.payout)+'</span></div>').join('')
      +'<div class="r tot"><span>'+due.length+' task(s)</span><span>'+money(amount)+'</span></div></div>'
    +'<label class="f">Payment method</label><select id="p_method">'+METHODS.map(m=>'<option'+(s.pay_method===m?' selected':'')+'>'+esc(m)+'</option>').join('')+'</select>'
    +'<label class="f">Reference / note (optional)</label><input id="p_ref" placeholder="e.g. CashApp confirmation #">'
    +'<label class="f">Payout screenshot (required)</label>'
    +'<label class="btn evbtn" style="display:inline-block">📷 Upload payout screenshot<input type="file" accept="image/*" id="p_shot"></label>'
    +'<div class="proof" id="p_prev"></div>'
    +'<div class="meta" style="margin-top:8px">The exact time is stamped automatically when you confirm.</div>'
    +'<div class="mact"><button class="btn" data-close="ovPayout">Cancel</button><button class="btn pri" id="p_go">Mark as paid</button></div>';
  openOv('ovPayout');bindClose();
  document.getElementById('p_shot').onchange=async e=>{
    const f=e.target.files&&e.target.files[0];if(!f)return;
    const blob=await resizeImage(f,1400);if(!blob){toast('Could not read that image');return;}
    PROOF=blob;
    document.getElementById('p_prev').innerHTML='<img src="'+URL.createObjectURL(blob)+'" alt="proof"><div class="meta">Screenshot attached</div>';
  };
  document.getElementById('p_go').onclick=()=>confirmPayout(memberId,amount,due);
}
async function confirmPayout(memberId,amount,due){
  if(!PROOF){toast('Upload the payout screenshot as proof first');return;}
  const btn=document.getElementById('p_go');btn.disabled=true;btn.textContent='Saving…';
  try{
    const path=memberId+'/payouts/'+DAY+'-'+Date.now()+'.jpg';
    await upload(path,PROOF);
    const ins=await sb.from('team_payouts').insert({member_id:memberId,day:DAY,amount:amount,
      method:document.getElementById('p_method').value,ref:document.getElementById('p_ref').value.trim(),
      proof_path:path,task_count:due.length,paid_by:ME||'Admin'}).select().single();
    if(ins.error)throw ins.error;
    const ids=due.map(t=>t.id);
    const upd=await sb.from('team_tasks').update({paid:true,payout_id:ins.data.id}).in('id',ids).select();
    if(upd.error)throw upd.error;
    PAYOUTS.unshift(ins.data);
    (upd.data||[]).forEach(t=>{const i=TASKS.findIndex(x=>x.id===t.id);if(i>=0)TASKS[i]=t;});
    PROOF=null;closeOv('ovPayout');render();
    toast('Paid '+money(amount)+' — proof saved');
  }catch(e){console.error(e);toast('Payout failed: '+(e.message||e));
    btn.disabled=false;btn.textContent='Mark as paid';}
}

    +'<label class="f">Full name</label><input id="m_name" value="'+esc(s.name||'')+'">'
    +'<label class="f">Role</label><select id="m_role">'
      +[['RC','Rental Coordinator'],['V','Vendor'],['MM','Maintenance Manager'],['SA','Super Admin']]
        .map(r=>'<option value="'+r[0]+'"'+(s.role===r[0]?' selected':'')+'>'+r[0]+' — '+r[1]+'</option>').join('')+'</select>'
    +'<div class="f2"><div><label class="f">Email</label><input id="m_email" value="'+esc(s.email||'')+'"></div>'
      +'<div><label class="f">Phone</label><input id="m_phone" value="'+esc(s.phone||'')+'"></div></div>'
    +'<label class="f">WhatsApp</label><input id="m_wa" value="'+esc(s.whatsapp||'')+'">'
    +'<div class="f2"><div><label class="f">Payout method</label><select id="m_pay">'

      +'<div><label class="f">Available hours</label><input id="m_hours" value="'+esc(s.hours||'')+'" placeholder="Mon–Sat, 8am–6pm"></div></div>'
    +'<label class="f">What else do they do?</label><input id="m_other" value="'+esc(s.other_work||'')+'">'
    +'<label class="f" style="margin-top:12px"><input type="checkbox" id="m_active" style="width:auto;margin-right:6px"'+(s.active!==false?' checked':'')+'> Active</label>'
    +'<div class="mact"><button class="btn" data-close="ovMember">Cancel</button>'
      +(id?'<button class="btn danger" id="m_del">Remove</button>':'')
      +'<button class="btn pri" id="m_save">Save</button></div>';
  openOv('ovMember');bindClose();
  document.getElementById('m_save').onclick=async()=>{
    const name=document.getElementById('m_name').value.trim();
    if(!name){toast('Enter a name');return;}
    const row={name:name,role:document.getElementById('m_role').value,
      email:document.getElementById('m_email').value.trim()||null,
      phone:document.getElementById('m_phone').value.trim()||null,
      whatsapp:document.getElementById('m_wa').value.trim()||null,
      pay_method:document.getElementById('m_pay').value,
      hours:document.getElementById('m_hours').value.trim()||null,
      other_work:document.getElementById('m_other').value.trim()||null,
      active:document.getElementById('m_active').checked};
    const r=id?await sb.from('team_members').update(row).eq('id',id).select().single()
              :await sb.from('team_members').insert(row).select().single();
    if(r.error){toast('Failed: '+r.error.message);return;}
    if(id){const i=MEMBERS.findIndex(m=>m.id===id);if(i>=0)MEMBERS[i]=r.data;}else MEMBERS.push(r.data);
    MEMBERS.sort((a,b)=>(a.name||'').localeCompare(b.name||''));
    closeOv('ovMember');render();toast('Saved');
  };
  const del=document.getElementById('m_del');
  if(del)del.onclick=async()=>{
    if(!confirm('Remove '+(s.name||'this member')+'? Their tasks and payout history are deleted too.'))return;
    const r=await sb.from('team_members').delete().eq('id',id);
    if(r.error){toast('Failed: '+r.error.message);return;}
    MEMBERS=MEMBERS.filter(m=>m.id!==id);TASKS=TASKS.filter(t=>t.member_id!==id);PAYOUTS=PAYOUTS.filter(p=>p.member_id!==id);
    closeOv('ovMember');VIEW='board';CUR=null;render();toast('Member removed');
  };
}

    +'<label class="f">Type</label><select id="r_kind">'+['Car wash','Fuel','Parts','Lyft / Uber','Other'].map(k=>'<option>'+k+'</option>').join('')+'</select>'

    +'<div class="proof" id="r_prev"></div>'

  document.getElementById('r_shot').onchange=async e=>{

async function viewImg(path){
  const u=await signed(path);
  document.getElementById('mdImg').innerHTML='<h3>Attachment</h3>'
    +(u?'<img src="'+u+'" alt="" style="width:100%;border-radius:10px;border:1px solid var(--line)">':'<div class="empty">Could not load this file.</div>')
    +'<div class="mact"><button class="btn" data-close="ovImg">Close</button>'
    +(u?'<a class="btn pri" href="'+u+'" target="_blank" rel="noopener" style="text-align:center;text-decoration:none">Open full size</a>':'')+'</div>';
  openOv('ovImg');bindClose();
}
function bindClose(){document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeOv(b.dataset.close));}

/* ---------- wiring ---------- */
function wire(){
  const on=(sel,fn)=>document.querySelectorAll(sel).forEach(fn);
  on('[data-go]',el=>el.onclick=()=>{const g=el.dataset.go;if(g==='board'){VIEW='board';CUR=null;}else VIEW=g;render();});
  on('[data-open]',el=>el.onclick=()=>{CUR=el.dataset.open;VIEW='member';render();});
  on('[data-refresh]',el=>el.onclick=async()=>{toast('Refreshing…');await reload();});
  on('[data-addmember]',el=>el.onclick=()=>openMember(null));
  on('[data-editmember]',el=>el.onclick=()=>openMember(el.dataset.editmember));
  on('[data-assign]',el=>el.onclick=()=>openAssign(el.dataset.assign,null));
  on('[data-edittask]',el=>el.onclick=()=>{const t=TASKS.find(x=>x.id===el.dataset.edittask);if(t)openAssign(t.member_id,t.id);});
  on('[data-deltask]',el=>el.onclick=()=>delTask(el.dataset.deltask));
  on('[data-pay]',el=>el.onclick=()=>openPayout(el.dataset.pay));
  on('[data-refund]',el=>el.onclick=()=>openRefund(el.dataset.refund));
  on('[data-start]',el=>el.onclick=()=>startTask(el.dataset.start));
  on('[data-stop]',el=>el.onclick=()=>stopTask(el.dataset.stop));
  on('[data-done]',el=>el.onclick=()=>completeTask(el.dataset.done));
  on('[data-cost]',el=>el.onclick=()=>addCost(el.dataset.cost));
  on('[data-ev]',el=>el.onchange=()=>addEvidence(el.dataset.ev,el));
  on('[data-delev]',el=>el.onclick=()=>{const p=el.dataset.delev.split('|');delEvidence(p[0],+p[1]);});
  on('[data-view]',el=>el.onclick=()=>viewImg(el.dataset.view));
  on('[data-carry]',el=>el.onclick=()=>carryTask(el.dataset.carry,todayET()));
  on('[data-carryto]',el=>el.onclick=()=>{const i=document.getElementById('cd_'+el.dataset.carryto);carryTask(el.dataset.carryto,i?i.value:'');});
  on('[data-notes]',el=>el.onchange=()=>patchTask(el.dataset.notes,{notes:el.value}));
  on('[data-day]',el=>el.onclick=()=>{DAY=shiftDay(DAY,+el.dataset.day);render();});
  on('[data-today]',el=>el.onclick=()=>{DAY=todayET();render();});
  on('[data-approve]',el=>el.onclick=async()=>{
    const r=await sb.from('team_refunds').update({status:'Approved'}).eq('id',el.dataset.approve).select().single();
    if(r.error){toast('Failed');return;}
    const i=REFUNDS.findIndex(x=>x.id===el.dataset.approve);if(i>=0)REFUNDS[i]=r.data;render();toast('Refund approved');
  });
  on('[data-map]',el=>el.onclick=()=>{
    const t=TASKS.find(x=>x.id===el.dataset.map);if(!t)return;
    const pts=(t.stops||[]).filter(Boolean);if(pts.length<2){toast('No route addresses set');return;}
    const e=encodeURIComponent;
    const way=pts.slice(1,-1).map(e).join('%7C');
    window.open('https://www.google.com/maps/dir/?api=1&origin='+e(pts[0])+'&destination='+e(pts[pts.length-1])+(way?'&waypoints='+way:''),'_blank','noopener');
  });
  const dp=document.getElementById('dayPick');
  if(dp)dp.onchange=()=>{if(dp.value){DAY=dp.value;render();}};
}

/* ---------- boot ---------- */
async function start(){await load();document.getElementById('appwrap').style.display='block';render();}
function showApp(){document.getElementById('loginwrap').style.display='none';document.getElementById('noadmin').style.display='none';}
async function gate(){
  const s=await sb.auth.getSession();
  const u=s.data.session&&s.data.session.user;
  if(!u){document.getElementById('loginwrap').style.display='flex';return;}
  ME=u.email||'';
  if(ADMINS.indexOf(ME.toLowerCase())<0){
    document.getElementById('loginwrap').style.display='none';
    document.getElementById('noadmin').style.display='flex';
    document.getElementById('noadmin_who').textContent='Signed in as '+ME+' — this page is limited to admins.';
    return;
  }
  showApp();start();
}
document.getElementById('li_form').addEventListener('submit',async function(ev){
  ev.preventDefault();
  const b=document.getElementById('li_btn'),er=document.getElementById('li_err');
  er.textContent='';b.disabled=true;b.textContent='Signing in…';
  const r=await sb.auth.signInWithPassword({email:document.getElementById('li_email').value.trim(),password:document.getElementById('li_pass').value});
  b.disabled=false;b.textContent='Sign in';
  if(r.error){er.textContent=r.error.message;return;}
  location.reload();
});
document.getElementById('signout').onclick=async()=>{await sb.auth.signOut();location.reload();};
document.getElementById('na_out').onclick=async()=>{await sb.auth.signOut();location.reload();};
gate();
</script>
