<style>
:root{--bg:#eef1f5;--surface:#fff;--surface-2:#f2f5f9;--text:#131820;--muted:#5c6a7a;--line:#c9d2de;--line-strong:#9aa8b8;--brand:#0f8a4d;--in:#0a7d44;--out:#c22a2a;--shadow:0 1px 2px rgba(16,24,40,.08),0 1px 3px rgba(16,24,40,.06);--radius:12px}
@media(prefers-color-scheme:dark){:root{--bg:#0c0f14;--surface:#151b23;--surface-2:#1b2330;--text:#e7ebf1;--muted:#93a0b0;--line:#2b333f;--line-strong:#3c4757;--brand:#12a35c;--in:#38d07f;--out:#f36f6f}}
:root[data-theme=light]{--bg:#eef1f5;--surface:#fff;--surface-2:#f2f5f9;--text:#131820;--muted:#5c6a7a;--line:#c9d2de;--line-strong:#9aa8b8;--brand:#0f8a4d;--in:#0a7d44;--out:#c22a2a}
:root[data-theme=dark]{--bg:#0c0f14;--surface:#151b23;--surface-2:#1b2330;--text:#e7ebf1;--muted:#93a0b0;--line:#2b333f;--line-strong:#3c4757;--brand:#12a35c;--in:#38d07f;--out:#f36f6f}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14.5px;line-height:1.4}
.topbar{display:flex;align-items:center;gap:14px;padding:11px 20px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.brand{font-weight:800;font-size:17px}.brand span{color:var(--brand)}
.sub{font-size:12.5px;color:var(--muted);font-weight:700}.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 13px;font-weight:700;font-size:13px;cursor:pointer;color:var(--text);font-family:inherit}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.pri{background:var(--brand);color:#fff;border-color:var(--brand)}.btn.pri:hover{color:#fff;opacity:.92}
.btn.danger{color:var(--out)}.btn.danger:hover{border-color:var(--out)}
.wrap{max-width:1000px;margin:0 auto;padding:16px 20px 60px}
.ctl{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;box-shadow:var(--shadow)}
.grand{margin-left:auto;text-align:right}.grand .l{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}.grand .v{font-size:24px;font-weight:800;color:var(--brand)}
.savestate{font-size:12px;font-weight:700;color:var(--muted)}
.owner{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin-top:16px;overflow:hidden}
.ohead{display:flex;align-items:center;gap:12px;padding:14px 18px;background:linear-gradient(0deg,color-mix(in srgb,var(--brand) 6%,var(--surface)),var(--surface));border-bottom:1px solid var(--line);flex-wrap:wrap}
.ohead .oname{font-weight:800;font-size:16px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:6px 9px;border-radius:8px;min-width:180px}
.ohead .oname:focus{border-color:var(--line);background:var(--surface);outline:none}
.otot{margin-left:auto;text-align:right}.otot .l{font-size:10px;font-weight:800;text-transform:uppercase;color:var(--muted)}.otot .v{font-size:20px;font-weight:800;color:var(--brand)}
.cars{padding:10px 14px 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(262px,1fr));gap:12px}.ctl label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}.ctl input{padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);font-family:inherit;font-size:13.5px}.otot .permo{font-size:11px;color:var(--muted);font-weight:700}.carcard{border:1px solid var(--line);border-radius:12px;padding:11px;background:var(--surface-2);display:flex;flex-direction:column;gap:7px}.carcard.inactive{opacity:.55}.carcard .cc-head{display:flex;gap:6px;align-items:center}.carcard input{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--text);font-family:inherit;font-size:13px}.carcard .cname{font-weight:800}.carcard .cc-ids{display:flex;gap:6px}.carcard .cc-row{display:flex;gap:8px}.carcard .cc-row label{flex:1;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);display:flex;flex-direction:column;gap:3px}.carcard .cc-row input{text-align:right;font-variant-numeric:tabular-nums}.carcard .cc-calc{border-top:1px dashed var(--line);padding-top:7px;display:flex;flex-direction:column;gap:2px;font-size:12px;font-variant-numeric:tabular-nums}.carcard .cc-calc .fee{color:var(--out)}.carcard .cc-calc .net{font-weight:800;color:var(--in)}.carcard .cc-calc .net.big{font-size:14px}.carcard .act{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}.carcard .maint{border-top:1px dashed var(--line);padding-top:7px}.carcard .maint .mh{display:flex;justify-content:space-between;align-items:center;font-size:10px;font-weight:800;text-transform:uppercase;color:var(--muted);margin-bottom:5px}.carcard .maddbtn{border:1px dashed var(--line-strong);background:transparent;color:var(--muted);border-radius:6px;font-size:11px;padding:2px 7px;cursor:pointer;font-family:inherit;font-weight:700}.carcard .mitem{display:grid;grid-template-columns:110px 1fr 66px auto;gap:4px;align-items:center;margin-bottom:4px}.carcard .mitem input{padding:4px 6px;font-size:11.5px}.carcard .mitem .mamt{text-align:right}.carcard .mitem .mdel{border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:13px;padding:0}.carcard .mtot{font-size:11px;color:var(--muted);font-weight:700;text-align:right}
.chdr{display:grid;grid-template-columns:1.3fr .8fr 1fr 1.1fr .7fr auto auto;gap:10px;padding:6px 6px 2px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
.crow{display:grid;grid-template-columns:1.3fr .8fr 1fr 1.1fr .7fr auto auto;gap:10px;align-items:center;padding:7px 6px;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:none}
.crow input[type=text],.crow input[type=number]{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);font-family:inherit;font-size:13.5px}
.crow .cprice{text-align:right;font-variant-numeric:tabular-nums}
.crow .act{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:700}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:30px;height:30px;cursor:pointer;color:var(--muted);font-weight:800;font-family:inherit}
.iconbtn:hover{border-color:var(--out);color:var(--out)}
.ofoot{padding:10px 16px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.empty{text-align:center;color:var(--muted);padding:40px 20px}
.hint{color:var(--muted);font-size:12px;margin-top:16px}
.loginwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.logincard{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:28px;width:340px;max-width:100%}
.logincard h1{margin:0 0 4px;font-size:22px}.logincard h1 span{color:var(--brand)}
.logincard p{margin:0 0 16px;color:var(--muted);font-size:13px}
.logincard label{display:block;font-size:11px;font-weight:800;text-transform:uppercase;color:var(--muted);margin:10px 0 4px}
.logincard input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);font-family:inherit;font-size:14px}
.logincard button{width:100%;margin-top:16px;padding:10px;background:var(--brand);color:#fff;border:none;border-radius:9px;font-weight:800;font-size:14px;cursor:pointer;font-family:inherit}
.err{color:var(--out);font-size:12.5px;margin-top:10px;min-height:16px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--brand);color:#fff;padding:11px 18px;border-radius:10px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:60}
.brandlogo{height:30px;display:block}.loginlogo{text-align:center;margin-bottom:8px}.loginlogo img{height:58px;max-width:100%}

<div id="loginwrap" class="loginwrap" style="display:none"><form class="logincard" id="li_form"><div class="loginlogo"><img src="assets/logo.png" alt="Rent 2 Go"></div><p>Fleet — admin sign in.</p><label>Email</label><input id="li_email" type="email" autocomplete="username" required><label>Password</label><input id="li_pass" type="password" autocomplete="current-password" required><button id="li_btn" type="submit">Sign in</button><div class="err" id="li_err"></div></form></div>

<script>
const sb=window.supabase.createClient(window.R2G_CONFIG.SUPABASE_URL, window.R2G_CONFIG.SUPABASE_ANON_KEY);
const ADMINS=['gorentaride@gmail.com','thurstonrdavis@gmail.com'];
const uid=p=>p+Math.random().toString(36).slice(2,9);
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
let STATE=[],SETTINGS={},SAVET=null;const r2=n=>Math.round((+n||0)*100)/100;const money=v=>'$'+(+v||0).toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2});
function setStatus(s){var el=document.getElementById('savestate');if(el)el.textContent=s==='saving'?'Saving…':s==='saved'?'Saved ✓':s==='error'?'Save error':'';}
function toast(m){var h=document.getElementById('toastHost');h.innerHTML='<div class="toast">'+m+'</div>';setTimeout(()=>{h.innerHTML='';},2400);}
function scheduleSave(){setStatus('saving');clearTimeout(SAVET);SAVET=setTimeout(save,600);}
async function save(){try{var r=await sb.from('fleet').update({owners:STATE,settings:SETTINGS,updated_at:new Date().toISOString()}).eq('id',1);if(r.error)throw r.error;setStatus('saved');}catch(e){console.error(e);setStatus('error');clearTimeout(SAVET);SAVET=setTimeout(save,3000);}}

function feePerDay(c){var earn=+c.earn||0;if(earn<=0)return 0;return r2(earn*(+SETTINGS.stripePct||0)/100+(+SETTINGS.stripeFixed||0));}
function netDay(c){return r2((+c.earn||0)-feePerDay(c));}
function netMonth(c){return r2(netDay(c)*(+SETTINGS.daysPerMonth||30));}
function ownerNetDay(o){return r2((o.cars||[]).filter(c=>c.active!==false).reduce((s,c)=>s+netDay(c),0));}
function ownerNetMonth(o){return r2(ownerNetDay(o)*(+SETTINGS.daysPerMonth||30));}
function maintHTML(c,oi,ci){var m=c.maint||[];var t=m.reduce((s,x)=>s+(+x.amount||0),0);return '<div class="maint"><div class="mh"><span>🔧 Maintenance ('+m.length+')</span><button class="maddbtn" data-maddm="'+oi+'|'+ci+'">+ log</button></div>'+m.map(function(x,mi){return '<div class="mitem"><input class="mdate" type="date" data-mfield="'+oi+'|'+ci+'|'+mi+'|date" value="'+esc(x.date||'')+'"><input class="mdesc" type="text" placeholder="Item (e.g. Tyres)" data-mfield="'+oi+'|'+ci+'|'+mi+'|desc" value="'+esc(x.desc||'')+'"><input class="mamt" type="number" min="0" step="1" placeholder="$" data-mfield="'+oi+'|'+ci+'|'+mi+'|amount" value="'+(+x.amount||0)+'"><button class="mdel" data-mdel="'+oi+'|'+ci+'|'+mi+'" title="Remove">×</button></div>';}).join('')+(m.length?'<div class="mtot">Total maintenance '+money(t)+'</div>':'')+'</div>';}
function render(){
  var host=document.getElementById('owners');
  var fleetMonth=STATE.reduce((s,o)=>s+ownerNetMonth(o),0);
  document.getElementById('grand').textContent=money(fleetMonth);
  if(!STATE.length){host.innerHTML='<div class="owner"><div class="empty">No owners yet.<br><br><button class="btn pri" onclick="document.getElementById(\'addOwner\').click()">+ Add your first owner</button></div></div>';return;}
  host.innerHTML=STATE.map(function(o,oi){
    var cards=(o.cars||[]).map(function(c,ci){
      var fee=feePerDay(c),nd=netDay(c),nm=netMonth(c),inact=(c.active===false);
      return '<div class="carcard'+(inact?' inactive':'')+'">'
        +'<div class="cc-head"><input class="cname" data-cn="'+oi+'|'+ci+'" value="'+esc(c.name||'')+'" placeholder="Car / model"><button class="iconbtn" data-delcar="'+oi+'|'+ci+'" title="Remove">×</button></div>'
        +'<div class="cc-ids"><input data-cp="'+oi+'|'+ci+'" value="'+esc(c.plate||'')+'" placeholder="Plate"><input data-cv="'+oi+'|'+ci+'" value="'+esc(c.vin||'')+'" placeholder="VIN"></div>'
        +'<input data-cm="'+oi+'|'+ci+'" value="'+esc(c.make||'')+'" placeholder="Make / notes">'
        +'<div class="cc-row"><label>List $/day<input type="number" min="0" step="1" data-cprice="'+oi+'|'+ci+'" value="'+(+c.price||0)+'"></label><label>Earns/day<input type="number" min="0" step="1" data-cearn="'+oi+'|'+ci+'" value="'+(+c.earn||0)+'"></label></div>'
        +'<div class="cc-calc"><span class="fee">− Stripe fee/day '+money(fee)+'</span><span class="net">Net/day '+money(nd)+'</span><span class="net big">Net/month '+money(nm)+'</span></div>'
        +maintHTML(c,oi,ci)
        +'<label class="act"><input type="checkbox" data-ca="'+oi+'|'+ci+'"'+(inact?'':' checked')+'> active (counts to revenue)</label>'
      +'</div>';
    }).join('');
    var nc=(o.cars||[]).length,and=ownerNetDay(o),anm=ownerNetMonth(o);
    return '<div class="owner"><div class="ohead">'
      +'<input class="oname" data-on="'+oi+'" value="'+esc(o.name||'')+'" placeholder="Owner name">'
      +'<div class="otot"><div class="l">'+nc+' car'+(nc===1?'':'s')+' · revenue</div><div class="v tnum">'+money(anm)+'<span class="permo"> /mo</span></div><div class="l" style="margin-top:2px;text-transform:none">'+money(and)+' / day (net of Stripe)</div></div></div>'
      +'<div class="cars">'+(nc?cards:'<div class="hint" style="padding:10px 6px">No cars yet.</div>')+'</div>'
      +'<div class="ofoot"><button class="btn" data-addcar="'+oi+'">+ Add car</button><span class="spacer"></span><button class="btn danger" data-delowner="'+oi+'">Remove owner</button></div></div>';
  }).join('');
  wire();
}
function wire(){
  document.querySelectorAll('[data-on]').forEach(el=>el.onchange=()=>{STATE[+el.dataset.on].name=el.value;scheduleSave();});
  function txt(k,field){document.querySelectorAll('[data-'+k+']').forEach(el=>el.onchange=()=>{var p=el.dataset[k].split('|');STATE[+p[0]].cars[+p[1]][field]=el.value;scheduleSave();});}
  txt('cn','name');txt('cp','plate');txt('cv','vin');txt('cm','make');
  document.querySelectorAll('[data-cprice]').forEach(el=>el.onchange=()=>{var p=el.dataset.cprice.split('|');STATE[+p[0]].cars[+p[1]].price=+el.value||0;scheduleSave();});
  document.querySelectorAll('[data-cearn]').forEach(el=>el.onchange=()=>{var p=el.dataset.cearn.split('|');STATE[+p[0]].cars[+p[1]].earn=+el.value||0;scheduleSave();render();});
  document.querySelectorAll('[data-ca]').forEach(el=>el.onchange=()=>{var p=el.dataset.ca.split('|');STATE[+p[0]].cars[+p[1]].active=el.checked;scheduleSave();render();});
  document.querySelectorAll('[data-addcar]').forEach(el=>el.onclick=()=>{var o=STATE[+el.dataset.addcar];o.cars=o.cars||[];o.cars.push({id:uid('car_'),name:'',plate:'',vin:'',make:'',price:0,earn:0,active:true,maint:[]});scheduleSave();render();});
  document.querySelectorAll('[data-delcar]').forEach(el=>el.onclick=()=>{var p=el.dataset.delcar.split('|');if(!confirm('Remove this car?'))return;STATE[+p[0]].cars.splice(+p[1],1);scheduleSave();render();});
  document.querySelectorAll('[data-delowner]').forEach(el=>el.onclick=()=>{var o=STATE[+el.dataset.delowner];if(!confirm('Remove owner "'+(o.name||'Unnamed')+'" and their cars?'))return;STATE.splice(+el.dataset.delowner,1);scheduleSave();render();});
  document.querySelectorAll('[data-maddm]').forEach(b=>b.onclick=()=>{var p=b.dataset.maddm.split('|');var c=STATE[+p[0]].cars[+p[1]];c.maint=c.maint||[];c.maint.push({id:uid('m_'),date:'',desc:'',amount:0});scheduleSave();render();});
  document.querySelectorAll('[data-mfield]').forEach(el=>el.onchange=()=>{var p=el.dataset.mfield.split('|');var m=(STATE[+p[0]].cars[+p[1]].maint||[])[+p[2]];if(!m)return;m[p[3]]=(p[3]==='amount')?(+el.value||0):el.value;scheduleSave();if(p[3]==='amount')render();});
  document.querySelectorAll('[data-mdel]').forEach(b=>b.onclick=()=>{var p=b.dataset.mdel.split('|');if(!confirm('Remove this maintenance item?'))return;STATE[+p[0]].cars[+p[1]].maint.splice(+p[2],1);scheduleSave();render();});
}
async function load(){var r=await sb.from('fleet').select('owners,settings').eq('id',1).single();if(r.error)console.error(r.error);STATE=(r.data&&r.data.owners)||[];SETTINGS=Object.assign({stripePct:2.9,stripeFixed:0.30,daysPerMonth:30},(r.data&&r.data.settings)||{});STATE.forEach(o=>{o.id=o.id||uid('o_');o.cars=(o.cars||[]).map(c=>({id:c.id||uid('car_'),name:c.name||'',plate:c.plate||'',vin:c.vin||'',make:c.make||'',price:+c.price||0,earn:+c.earn||0,active:c.active!==false,maint:(c.maint||[]).map(m=>({id:m.id||uid('m_'),date:m.date||'',desc:m.desc||'',amount:+m.amount||0}))}));});}
function showApp(){document.getElementById('loginwrap').style.display='none';document.getElementById('noadmin').style.display='none';document.getElementById('appwrap').style.display='block';}
async function start(){
  document.getElementById('addOwner').onclick=()=>{STATE.push({id:uid('o_'),name:'',cars:[]});scheduleSave();render();var el=document.querySelector('.owner:last-child .oname');if(el)el.focus();};
  await load();
  var sp=document.getElementById('sPct'),sf=document.getElementById('sFix'),sd=document.getElementById('sDays');
  if(sp){sp.value=SETTINGS.stripePct;sp.onchange=()=>{SETTINGS.stripePct=+sp.value||0;scheduleSave();render();};}
  if(sf){sf.value=SETTINGS.stripeFixed;sf.onchange=()=>{SETTINGS.stripeFixed=+sf.value||0;scheduleSave();render();};}
  if(sd){sd.value=SETTINGS.daysPerMonth;sd.onchange=()=>{SETTINGS.daysPerMonth=+sd.value||30;scheduleSave();render();};}
  showApp();render();setStatus('saved');
}
async function gate(){var s=await sb.auth.getSession();var u=s.data.session&&s.data.session.user;if(!u){document.getElementById('loginwrap').style.display='flex';return;}if(ADMINS.indexOf((u.email||'').toLowerCase())<0){document.getElementById('loginwrap').style.display='none';document.getElementById('noadmin').style.display='flex';document.getElementById('noadmin_who').textContent='Signed in as '+u.email+' — this page is limited to admins.';return;}start();}
